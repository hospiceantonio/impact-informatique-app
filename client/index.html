<header class="topbar" id="topbar"></header>

<main id="vue" class="vue" tabindex="-1"></main>

<nav class="tabbar" id="tabbar" aria-label="Navigation principale">
  <!-- Le nom de l'enseigne, en tête du menu latéral : visible sur
       ordinateur seulement, où le menu passe à gauche. C'est le logo de
       la charte, écrit par la feuille de style — pas l'icône de
       l'application, qui est un dessin fait pour un écran d'accueil et
       qui, posée ici, donnait deux marques côte à côte. -->
  <div class="tabbar-marque" aria-hidden="true"><span class="logo-mot"><span class="logo-bizz">Bizz</span><span class="logo-oo">oo</span><span class="logo-points"><i></i><i></i></span></span></div>
  <a href="#/" data-tab="/"><svg class="ic" viewBox="0 0 24 24"><use href="#i-accueil"/></svg><span>Accueil</span></a>
  <a href="#/categories" data-tab="/categories"><svg class="ic" viewBox="0 0 24 24"><use href="#i-categories"/></svg><span>Catégories</span></a>
  <a href="#/produits" data-tab="/produits"><svg class="ic" viewBox="0 0 24 24"><use href="#i-boite"/></svg><span>Produits</span></a>
  <a href="#/recherche" data-tab="/recherche"><svg class="ic" viewBox="0 0 24 24"><use href="#i-recherche"/></svg><span>Recherche</span></a>
  <a href="#/infos" data-tab="/infos"><svg class="ic" viewBox="0 0 24 24"><use href="#i-infos"/></svg><span>Infos</span></a>
  <!-- Dans une boutique, « Accueil » ramène à SA vitrine : celui-ci
       ramène à BIZZOO, c'est-à-dire à toutes les boutiques. Il n'a donc
       de sens que lorsqu'on est entré quelque part. -->
  <a id="tab-bizzoo" href="#/" hidden><img class="tab-logo" src="icons/icon-192.png" alt=""><span>BIZZOO</span></a>
  <!-- Pas un écran : le lien part vers WhatsApp. Le numéro est celui de
       BIZZOO et vient du catalogue, donc il est posé par app.js ; sans
       numéro renseigné, l'onglet reste caché. Dans une boutique il
       s'efface au profit du bouton flottant, juste en dessous. -->
  <a id="tab-contact" class="tab-contact" href="#/infos" aria-label="Nous contacter sur WhatsApp" hidden><svg class="ic" viewBox="0 0 24 24"><use href="#i-whatsapp"/></svg><span>Contact</span></a>
</nav>

<!-- Dans une boutique, la barre du bas est pleine : « Contact » en sort
     et se pose ici, toujours au même endroit, quel que soit l'écran. -->
<a id="contact-flottant" class="contact-flottant" hidden target="_blank" rel="noopener"
   aria-label="Nous contacter sur WhatsApp">
  <svg class="ic" viewBox="0 0 24 24"><use href="#i-whatsapp"/></svg>
</a>

<div id="visionneuse" class="visionneuse" hidden>
  <button type="button" class="visionneuse-fermer btn-ic" data-action="fermer-visionneuse" aria-label="Fermer">
    <svg class="ic" viewBox="0 0 24 24"><use href="#i-fermer"/></svg>
  </button>
  <button type="button" class="visionneuse-telecharger btn-ic" id="visionneuse-telecharger" aria-label="Enregistrer la photo">
    <svg class="ic" viewBox="0 0 24 24"><use href="#i-telecharger"/></svg>
  </button>
  <!-- Le zoom se fait surtout à deux doigts ; ce bouton est là pour
       qu'on sache que c'est possible, et pour la souris. -->
  <button type="button" class="visionneuse-zoom btn-ic" id="visionneuse-zoom" aria-label="Agrandir la photo">
    <svg class="ic ic-zoom-plus" viewBox="0 0 24 24"><use href="#i-zoom-plus"/></svg>
    <svg class="ic ic-zoom-moins" viewBox="0 0 24 24"><use href="#i-zoom-moins"/></svg>
  </button>
  <div class="visionneuse-piste" id="visionneuse-piste"></div>
  <button type="button" class="visionneuse-fleche visionneuse-precedent" id="visionneuse-precedent" aria-label="Photo précédente" hidden>
    <svg class="ic" viewBox="0 0 24 24"><use href="#i-retour"/></svg>
  </button>
  <button type="button" class="visionneuse-fleche visionneuse-suivant" id="visionneuse-suivant" aria-label="Photo suivante" hidden>
    <svg class="ic" viewBox="0 0 24 24"><use href="#i-chevron"/></svg>
  </button>
  <div class="visionneuse-pied">
    <div class="visionneuse-points" id="visionneuse-points"></div>
    <div class="visionneuse-compteur" id="visionneuse-compteur"></div>
  </div>
</div>
