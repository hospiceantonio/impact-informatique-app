<header class="topbar" id="topbar"></header>

<main id="vue" class="vue" tabindex="-1"></main>

<nav class="tabbar" id="tabbar" aria-label="Navigation principale">
  <a href="#/" data-tab="/"><svg class="ic" viewBox="0 0 24 24"><use href="#i-accueil"/></svg><span>Accueil</span></a>
  <a href="#/produits" data-tab="/produits"><svg class="ic" viewBox="0 0 24 24"><use href="#i-boite"/></svg><span>Produits</span></a>
  <a href="#/produit/nouveau" class="tab-cta" aria-label="Nouveau produit"><span class="tab-cta-rond"><svg class="ic" viewBox="0 0 24 24"><use href="#i-plus"/></svg></span></a>
  <a href="#/categories" data-tab="/categories"><svg class="ic" viewBox="0 0 24 24"><use href="#i-categories"/></svg><span>Catégories</span></a>
  <a href="#/reglages" data-tab="/reglages"><svg class="ic" viewBox="0 0 24 24"><use href="#i-reglages"/></svg><span>Réglages</span></a>
</nav>

<div id="feuille" class="feuille" hidden>
  <div class="feuille-fond" data-action="fermer-feuille"></div>
  <div class="feuille-boite" role="dialog" aria-modal="true" aria-labelledby="feuille-titre">
    <div class="feuille-poignee"></div>
    <div class="feuille-entete">
      <h2 id="feuille-titre"></h2>
      <button type="button" class="btn-ic" data-action="fermer-feuille" aria-label="Fermer">
        <svg class="ic" viewBox="0 0 24 24"><use href="#i-fermer"/></svg>
      </button>
    </div>
    <div class="feuille-corps" id="feuille-corps"></div>
  </div>
</div>

<div id="visionneuse" class="visionneuse" hidden>
  <button type="button" class="visionneuse-fermer btn-ic" data-action="fermer-visionneuse" aria-label="Fermer">
    <svg class="ic" viewBox="0 0 24 24"><use href="#i-fermer"/></svg>
  </button>
  <div class="visionneuse-piste" id="visionneuse-piste"></div>
  <button type="button" class="visionneuse-fleche visionneuse-precedent" id="visionneuse-precedent" aria-label="Photo précédente" hidden>
    <svg class="ic" viewBox="0 0 24 24"><use href="#i-retour"/></svg>
  </button>
  <button type="button" class="visionneuse-fleche visionneuse-suivant" id="visionneuse-suivant" aria-label="Photo suivante" hidden>
    <svg class="ic" viewBox="0 0 24 24"><use href="#i-chevron"/></svg>
  </button>
  <div class="visionneuse-pied">
    <div class="visionneuse-points" id="visionneuse-points"></div>
    <div class="visionneuse-compteur" id="visionneuse-compteur"></div>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="config.js"></script>
<script src="js/utils.js"></script>
<script src="js/supabase.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/vues/connexion.js"></script>
<script src="js/vues/accueil.js"></script>
<script src="js/vues/produits.js"></script>
<script src="js/vues/categories.js"></script>
<script src="js/vues/historique.js"></script>
<script src="js/vues/reglages.js"></script>
<script src="js/app.js"></script>
</body>
