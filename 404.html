<!DOCTYPE html>
<html lang="fr" data-langue-flottant>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — BIZZOO</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F1E26">
<!-- CETTE PAGE S'AFFICHE À N'IMPORTE QUELLE PROFONDEUR : sous
     /une/adresse/inconnue, un lien relatif « client/ » mènerait à
     /une/adresse/client/. Tout ce qu'elle montre est donc dans ce
     fichier, et ses liens sont posés depuis la racine du site. -->
<style>
  /* (4.0.0) La charte BIZZOO Market : anthracite, turquoise, gris clair. */
  :root{--bleu:#007F7C;--turquoise:#00CFCB;--anthracite:#0F1E26;--encre:#0F1E26;
    --encre-douce:#3D4E57;--fond:#F2F7F9;--titre:'Montserrat','Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:var(--fond);color:var(--encre);
    font-family:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  main{width:min(440px,100%);text-align:center}
  /* Le logo des applications : le monogramme, puis « BIZZOO » et « Market ». */
  .logo{display:inline-flex;align-items:center;gap:.3em;font-size:32px;line-height:1}
  .logo-tuile{flex:none;display:block;width:1.75em;height:1.75em;object-fit:contain}
  .logo-mot{display:inline-flex;flex-direction:column;align-items:flex-start;
    font-family:var(--titre);font-style:italic;font-weight:800;white-space:nowrap}
  .logo-bizz{color:var(--anthracite);line-height:.95;letter-spacing:-.01em}
  .logo-oo{display:flex;align-items:center;gap:.4em;font-size:.54em;line-height:1.1;margin-top:.12em;color:var(--bleu)}
  .logo-oo::before,.logo-oo::after{content:"";display:block;width:.95em;height:.16em;border-radius:2px;background:currentColor}
  .code{margin:30px 0 4px;font-family:var(--titre);font-size:68px;font-weight:800;color:var(--anthracite);letter-spacing:-2px}
  .code::after{content:"";display:block;width:44px;height:4px;border-radius:4px;background:var(--turquoise);margin:6px auto 14px}
  h1{margin:0 0 10px;font-family:var(--titre);font-size:22px;font-weight:800}
  p{margin:0 0 26px;font-size:15px;line-height:1.55;color:var(--encre-douce)}
  .actions{display:grid;gap:12px}
  .btn{display:flex;align-items:center;justify-content:center;min-height:50px;padding:10px 22px;
    border-radius:999px;font-family:var(--titre);font-weight:700;font-size:15.5px;text-decoration:none}
  .btn-orange{background:var(--turquoise);color:var(--anthracite);box-shadow:0 12px 26px -14px rgba(0,207,203,.8)}
  .btn-clair{background:#fff;color:var(--bleu);border:1.5px solid var(--bleu)}
</style>
<script src="/vitrine/traductions-en.js"></script>
<script src="/vitrine/langue.js"></script>
</head>
<body>
<main>
  <span class="logo"><img class="logo-tuile" data-image="client/icons/logo-bizzoo-market.png" alt="" width="56" height="56"><span class="logo-mot" aria-label="BIZZOO Market"><span class="logo-bizz">BIZZOO</span><span class="logo-oo">Market</span></span></span>
  <div class="code" aria-hidden="true">404</div>
  <h1>Page introuvable</h1>
  <p>Cette adresse ne mène à aucune page de BIZZOO. Elle a peut-être changé,
     ou une lettre s'est glissée de travers.</p>
  <div class="actions">
    <a class="btn btn-orange" href="/client/" data-lien="client/">Ouvrir la boutique</a>
    <a class="btn btn-clair" href="/" data-lien="">Revenir à l'accueil</a>
  </div>
</main>
<script>
  /* La racine du site : « / » sur www.bizzoomarket.com, mais
     « /impact-informatique-app/ » sur GitHub Pages, où le site vit sous
     le nom du dépôt. Les liens écrits plus haut valent pour le premier
     cas ; ils sont corrigés ici pour le second. */
  (function () {
    var base = /\.github\.io$/.test(location.hostname)
      ? "/" + (location.pathname.split("/")[1] || "") + "/"
      : "/";
    var liens = document.querySelectorAll("[data-lien]");
    for (var i = 0; i < liens.length; i++) {
      liens[i].setAttribute("href", base + liens[i].getAttribute("data-lien"));
    }
    /* L'image du logo de même : posée en relatif, elle serait cherchée
       sous l'adresse inconnue elle-même. */
    var images = document.querySelectorAll("[data-image]");
    for (var j = 0; j < images.length; j++) {
      images[j].setAttribute("src", base + images[j].getAttribute("data-image"));
    }
    var police = document.createElement("style");
    police.textContent = [400, 600, 700].map(function (g) {
      return "@font-face{font-family:'Poppins';font-weight:" + g + ";font-display:swap;" +
        "src:url(" + base + "client/polices/poppins-" + g + ".woff2) format('woff2')}";
    }).join("") + [["normal", 700, "700"], ["normal", 800, "800"], ["italic", 800, "800-italique"]].map(function (m) {
      return "@font-face{font-family:'Montserrat';font-style:" + m[0] + ";font-weight:" + m[1] +
        ";font-display:swap;src:url(" + base + "client/polices/montserrat-" + m[2] + ".woff2) format('woff2')}";
    }).join("");
    document.head.appendChild(police);
  })();
</script>
</body>
</html>
