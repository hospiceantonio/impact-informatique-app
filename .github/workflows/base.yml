# Éprouve la base sur un vrai PostgreSQL à chaque modification du
# schéma. Les tests des applications simulent la base : ils valident
# l'écran, jamais les déclencheurs — ceux-ci ne s'exécutent que pour de
# vrai. C'est ici qu'on essaie de forcer les portes.
name: Éprouver la base

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/**"
      - "tools/eprouver-base.sh"
      - "tools/fichiers-autonomes.sh"
      - "tools/eprouver-menage.sh"
      - "tools/menage-stockage.ps1"
      - "tools/coquille-complete.sh"
      - "client/**"
      - "admin/**"
      - ".github/workflows/base.yml"
  pull_request:
    paths:
      - "supabase/**"

concurrency:
  group: base-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eprouver:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          # L'historique complet : le banc refait le chemin d'une base déjà
          # en service en repartant du schema.sql d'avant. Sans lui, cette
          # vérification se sauterait en silence.
          fetch-depth: 0

      - name: PostgreSQL
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql
          fi
          ls -d /usr/lib/postgresql/*/bin | tail -1

      - name: Forcer les portes
        run: bash tools/eprouver-base.sh

      # Ce script-là EFFACE des fichiers, et une suppression ne se
      # rattrape pas : on lui donne un faux Supabase et on regarde ce
      # qu'il lui envoie vraiment.
      - name: Éprouver le ménage du stockage
        run: bash tools/eprouver-menage.sh

      # Une liste de fichiers tenue à la main finit par mentir :
      # « compte.js » a vécu deux étapes hors de la coquille hors
      # connexion. En ligne rien ne se voyait ; hors connexion
      # l'application s'ouvrait cassée.
      - name: La coquille hors connexion est-elle complète ?
        run: bash tools/coquille-complete.sh
