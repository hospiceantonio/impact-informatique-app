# Éprouve les fonctions Edge à chaque modification : le paiement, et
# le transport SMS. Les services extérieurs — FeexPay, CREATISINTER —
# y sont des doublures : aucun appel ne sort, aucun SMS n'est facturé,
# et le banc ne rougit donc jamais parce qu'un serveur tousse ce
# matin-là.
name: Éprouver les fonctions

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/functions/**"
      - "tools/eprouver-paiement.sh"
      - "tools/eprouver-sms.sh"
      - ".github/workflows/paiement.yml"
  pull_request:
    paths:
      - "supabase/functions/**"

concurrency:
  group: paiement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eprouver:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Forcer les portes du paiement
        run: bash tools/eprouver-paiement.sh

      # Deux portes ici, et aucune ne se voit à la relecture : la
      # passerelle répond « 200 » en portant l'échec dans le corps, et le
      # hook de connexion se déploie sans jeton — sa signature est le
      # seul contrôle entre l'Internet et le crédit SMS de l'enseigne.
      - name: Forcer les portes du SMS
        run: bash tools/eprouver-sms.sh
