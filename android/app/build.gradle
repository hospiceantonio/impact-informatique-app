plugins {
    id "com.android.application"
}

// La signature Play reste hors du dépôt et ne remplace pas celle des APK de test.
def playStore = System.getenv("BIZZOO_PLAY_STORE_FILE")
def playStorePassword = System.getenv("BIZZOO_PLAY_STORE_PASSWORD")
def playKeyAlias = System.getenv("BIZZOO_PLAY_KEY_ALIAS")
def playKeyPassword = System.getenv("BIZZOO_PLAY_KEY_PASSWORD")
def playConfigured = [playStore, playStorePassword, playKeyAlias, playKeyPassword].every { it }

android {
    namespace "com.impactinformatique.apps"
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36
        versionCode 97
        versionName "3.55.0"
    }

    // Deux applications à partir du même code : client (bleue) et admin (rouge).
    flavorDimensions = ["application"]
    productFlavors {
        client {
            dimension "application"
            applicationId "com.impactinformatique.client"
        }
        admin {
            dimension "application"
            applicationId "com.impactinformatique.admin"
        }
    }

    signingConfigs {
        if (playConfigured) {
            play {
                storeFile file(playStore)
                storePassword playStorePassword
                keyAlias playKeyAlias
                keyPassword playKeyPassword
            }
        }
        // Clé de TEST pour installer les APK directement sur un téléphone.
        // La clé Play dédiée est conservée hors du dépôt.
        test {
            storeFile file("../signature/impact-test.keystore")
            storePassword "impact2026"
            keyAlias "impact"
            keyPassword "impact2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.test
        }
        play {
            initWith release
            matchingFallbacks = ["release"]
            signingConfig playConfigured ? signingConfigs.play : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name ==~ /(?i).*(client|admin)play.*/ }) {
        if (!playConfigured) {
            throw new GradleException("Signature Play absente : renseigner les quatre variables BIZZOO_PLAY_*.")
        }
        if (!file(playStore).isFile() || file(playStore).canonicalPath == file("../signature/impact-test.keystore").canonicalPath) {
            throw new GradleException("Une clé privée dédiée à Google Play est nécessaire.")
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.exifinterface:exifinterface:1.3.7"
    // Vérification périodique du catalogue, même application fermée (app client).
    implementation "androidx.work:work-runtime:2.9.1"
}
