plugins {
    id "com.android.application"
}

// La signature Play reste hors du dépôt et ne remplace pas celle des APK de test.
def playStore = System.getenv("BIZZOO_PLAY_STORE_FILE")
def playStorePassword = System.getenv("BIZZOO_PLAY_STORE_PASSWORD")
def playKeyAlias = System.getenv("BIZZOO_PLAY_KEY_ALIAS")
def playKeyPassword = System.getenv("BIZZOO_PLAY_KEY_PASSWORD")
def playConfigured = [playStore, playStorePassword, playKeyAlias, playKeyPassword].every { it }

// Les réglages Firebase de l'application CLIENT (notifications des lives
// TikTok). Ce sont des identifiants publics — ils figurent dans tout APK
// qui utilise Firebase —, pas des secrets : ils vivent dans
// android/firebase.properties. La clé privée du compte de service, elle,
// ne va JAMAIS ici : elle est dans les secrets Supabase.
// Vides, Firebase ne s'initialise pas et l'application marche comme avant.
def firebase = new Properties()
def fichierFirebase = rootProject.file("firebase.properties")
if (fichierFirebase.isFile()) fichierFirebase.withInputStream { firebase.load(it) }
def reglageFirebase = { String cle ->
    (System.getenv("BIZZOO_FIREBASE_" + cle.toUpperCase()) ?: firebase.getProperty(cle, "")).trim()
}

android {
    namespace "com.impactinformatique.apps"
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36
        versionCode 108
        versionName "3.64.0"
    }

    // Deux applications à partir du même code : client (bleue) et admin (rouge).
    flavorDimensions = ["application"]
    productFlavors {
        client {
            dimension "application"
            applicationId "com.impactinformatique.client"
            // Les noms que Firebase lit lui-même au démarrage (ceux que
            // fabrique d'ordinaire le fichier google-services.json).
            resValue "string", "google_app_id", reglageFirebase("app_id")
            resValue "string", "google_api_key", reglageFirebase("api_key")
            resValue "string", "project_id", reglageFirebase("project_id")
            resValue "string", "gcm_defaultSenderId", reglageFirebase("sender_id")
        }
        admin {
            dimension "application"
            applicationId "com.impactinformatique.admin"
        }
    }

    signingConfigs {
        if (playConfigured) {
            play {
                storeFile file(playStore)
                storePassword playStorePassword
                keyAlias playKeyAlias
                keyPassword playKeyPassword
            }
        }
        // Clé de TEST pour installer les APK directement sur un téléphone.
        // La clé Play dédiée est conservée hors du dépôt.
        test {
            storeFile file("../signature/impact-test.keystore")
            storePassword "impact2026"
            keyAlias "impact"
            keyPassword "impact2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.test
        }
        play {
            initWith release
            matchingFallbacks = ["release"]
            signingConfig playConfigured ? signingConfigs.play : null
        }
    }

    // Les « resValue » de Firebase ci-dessus : à garder explicitement allumé.
    buildFeatures {
        resValues true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name ==~ /(?i).*(client|admin)play.*/ }) {
        if (!playConfigured) {
            throw new GradleException("Signature Play absente : renseigner les quatre variables BIZZOO_PLAY_*.")
        }
        if (!file(playStore).isFile() || file(playStore).canonicalPath == file("../signature/impact-test.keystore").canonicalPath) {
            throw new GradleException("Une clé privée dédiée à Google Play est nécessaire.")
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.exifinterface:exifinterface:1.3.7"
    // Vérification périodique du catalogue, même application fermée (app client).
    implementation "androidx.work:work-runtime:2.9.1"
    // Notifications des lives TikTok (Firebase Cloud Messaging).
    implementation "com.google.firebase:firebase-messaging:24.1.0"
}
