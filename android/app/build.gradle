plugins {
    id "com.android.application"
}

android {
    namespace "com.impactinformatique.apps"
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35
        versionCode 49
        versionName "3.13.0"
    }

    // Deux applications à partir du même code : client (bleue) et admin (rouge).
    flavorDimensions = ["application"]
    productFlavors {
        client {
            dimension "application"
            applicationId "com.impactinformatique.client"
        }
        admin {
            dimension "application"
            applicationId "com.impactinformatique.admin"
        }
    }

    signingConfigs {
        // Clé de TEST pour installer les APK directement sur un téléphone.
        // Pour le Play Store, on générera une clé privée dédiée (jamais dans le dépôt).
        test {
            storeFile file("../signature/impact-test.keystore")
            storePassword "impact2026"
            keyAlias "impact"
            keyPassword "impact2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.test
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.exifinterface:exifinterface:1.3.7"
    // Vérification périodique du catalogue, même application fermée (app client).
    implementation "androidx.work:work-runtime:2.9.1"
}
